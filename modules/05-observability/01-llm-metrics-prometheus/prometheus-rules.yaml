groups:
  - name: llm-observability-rules
    rules:
      - alert: CUDA_OOM_Detected
        expr: |
          increase(container_last_seen_restart_reason{reason=~"OOM|oom|OutOfMemoryError"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "CUDA OOM detected on {{ $labels.instance }}"
          description: "One or more containers restarted due to OOM in the last 5 minutes. Investigate memory usage and checkpointing."

      - alert: GPU_VRAM_Saturation
        expr: |
          (sum by (instance, gpu_id) (gpu_vram_usage_bytes) / sum by (instance, gpu_id) (gpu_vram_total_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High GPU VRAM saturation on {{ $labels.instance }}"
          description: "GPU VRAM saturation above 90% for 5 minutes. Consider scaling or reducing batch size."

      - alert: LLM_TTF_Spike
        expr: |
          job:llm_ttft:avg_rate5m > 2
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Time-to-first-token spike for LLM service"
          description: "Average TTFT across instances exceeded 2s for over 2 minutes. Check model warmup, cold starts, or network issues."

      - alert: Internal_Token_Latency_Sustained
        expr: |
          job:llm_itl:percentile:95m > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High internal token latency (ITL) detected"
          description: "95th percentile ITL > 0.5s. Investigate model batching or streaming backpressure."
